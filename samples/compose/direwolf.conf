# The sound card the radio is on: 'aplay -l' lists them. plughw:1,0 is card 1, device 0.
ADEVICE plughw:1,0
CHANNEL 0
# Your callsign, with an SSID for the TNC.
MYCALL N0CALL-10
MODEM 1200
# Push to talk, if Dire Wolf keys the radio; a VOX interface needs none.
# PTT /dev/ttyUSB0 RTS
KISSPORT 8001
AGWPORT 0
