version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # fix(deps), so release-please opens a release PR: these packages ship inside ours (docs/versioning.md). Actions and
  # the SDK only change the build, so they stay chore(deps).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      test:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet.*"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # global.json is a floor, not a pin: any 10.0.x SDK >= 10.0.100 may build.
    # Distro SDKs (e.g. Fedora) lag on the 1xx feature band, so don't raise it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # The Dockerfile's base images, pinned by digest. A new digest is usually a security update to the image's OS or
  # .NET runtime, which ships in the aprscli image, so it is fix(deps) too: each one gives a release PR, and the release
  # publishes an image on the new base when PUBLISH_CONTAINER is on (docs/guides/container.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix(deps)"
    # 10.0 is .NET 10, the version the libraries and aprscli target. A new major (11.0) is a move to another .NET, made
    # on purpose with global.json and the target frameworks, not a base-image update. New 10.0 digests still come.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
