name: commits

# Pull requests are rebase-merged, so each commit lands on main as written and release-please reads every commit, not
# just the pull request title. This checks that every commit in a pull request follows Conventional Commits; a commit
# that does not would be left out of the changelog and the version bump without any warning. Merge commits are skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every commit message
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" \
            --jq '.[] | [.sha[0:7], (.parents | length), (.commit.message | split("\n")[0])] | @tsv' > commits.tsv
          bad=0
          while IFS=$'\t' read -r sha parents subject; do
            if [ "$parents" -gt 1 ]; then
              continue
            fi
            if printf '%s\n' "$subject" | grep -qE "$pattern"; then
              echo "ok  $sha $subject"
            else
              echo "::error::Commit $sha \"$subject\" is not a Conventional Commit: use type(scope): description."
              bad=1
            fi
          done < commits.tsv
          exit "$bad"
