name: release

# release-please keeps a release PR open on main. Merging it creates the vX.Y.Z tag and a GitHub
# release; the pack job then builds that tag. MinVer reads the tag, so no version lives in the repo.

on:
  push:
    branches: [main]

permissions: {}

# Pushes to main in quick succession queue rather than run release-please, or pack and publish a release, side by side.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o artifacts
      - name: Check every package is a pre-release
        # Until 1.0.0 every package must carry a pre-release suffix (0.x.y-alpha.N) so nuget.org lists it as one.
        run: |
          stable="$(find artifacts -name '*.nupkg' | grep -Ev '\.[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+\.nupkg$' || true)"
          if [ -n "$stable" ]; then
            echo "::error::Packages without a pre-release suffix:"; echo "$stable"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

  publish:
    # Pushes the release's packages to nuget.org with trusted publishing (no stored API key). Waits for approval on the
    # nuget environment, and is skipped until the NUGET_USER repository variable is set. See docs/versioning.md.
    needs: pack
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write # trusted publishing: exchange the GitHub OIDC token for a short-lived nuget.org key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # Symbol packages (.snupkg) next to each .nupkg are pushed with it. --skip-duplicate makes a re-run safe.
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  container:
    # Pushes the aprscli image for the release to the GitHub Container Registry, as ghcr.io/<owner>/aprscli:<version>.
    # Skipped until the PUBLISH_CONTAINER repository variable is 'true'. See docs/guides/container.md.
    needs: [release-please, pack]
    if: vars.PUBLISH_CONTAINER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aprscli"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg VERSION="$version" -t "$image:$version" .
          docker push "$image:$version"
