name: release

# release-please keeps a release PR open on main. Merging it creates the vX.Y.Z tag and a GitHub
# release; the pack job then builds that tag. MinVer reads the tag, so no version lives in the repo.

on:
  push:
    branches: [main]

permissions: {}

# Pushes to main in quick succession queue rather than run release-please, or pack and publish a release, side by side.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  pack:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o artifacts
      - name: Check every package is a pre-release
        # Until 1.0.0 every package must carry a pre-release suffix (0.x.y-alpha.N) so nuget.org lists it as one.
        run: |
          stable="$(find artifacts -name '*.nupkg' | grep -Ev '\.[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+\.nupkg$' || true)"
          if [ -n "$stable" ]; then
            echo "::error::Packages without a pre-release suffix:"; echo "$stable"; exit 1
          fi
      - name: Make the SBOM
        # One CycloneDX file for the release's packages and everything they depend on, attached with them below.
        run: |
          dotnet tool restore
          dotnet run tools/ci/Sbom.cs -- --packages artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*
      - name: Attach the packages and the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

  publish:
    # Pushes the release's packages to nuget.org with trusted publishing (no stored API key). Waits for approval on the
    # nuget environment, and is skipped until the NUGET_USER repository variable is set. See docs/versioning.md.
    needs: pack
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write # trusted publishing: exchange the GitHub OIDC token for a short-lived nuget.org key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # Symbol packages (.snupkg) next to each .nupkg are pushed with it. --skip-duplicate makes a re-run safe.
        run: |
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  container:
    # Pushes the aprscli image for the release to the GitHub Container Registry, as ghcr.io/<owner>/aprscli, for
    # linux/amd64 and linux/arm64, with an SBOM and build provenance, signed with cosign (keyless). Tags: the version
    # always; X.Y, X and latest only for a release that isn't a pre-release. Skipped until the PUBLISH_CONTAINER
    # repository variable is 'true'. See docs/guides/container.md.
    needs: [release-please, pack]
    if: vars.PUBLISH_CONTAINER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only to add the image's digest to the release notes
      packages: write # push to ghcr.io
      id-token: write # keyless signing and the provenance attestation, with the job's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          {
            echo "version=$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aprscli"
            # 0.9.0-alpha.1 is a pre-release: it gets only its own tag, never X.Y, X or latest.
            case "$version" in *-*) echo "stable=false" ;; *) echo "stable=true" ;; esac
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.stable }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.stable }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable }}
          labels: |
            org.opencontainers.image.title=aprscli
            org.opencontainers.image.description=APRS.NET's command-line tool: an APRS-IS client, a gateway and a KISS TNC tool.
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=aprscli
            org.opencontainers.image.description=APRS.NET's command-line tool: an APRS-IS client, a gateway and a KISS TNC tool.
            org.opencontainers.image.licenses=MIT
      - name: Build (amd64) for the smoke test
        # Smoke-tested before anything is pushed. Each platform is loaded on its own, since the runner's Docker holds
        # one platform per tag. The build stage runs natively for both, so the arm64 build and the push reuse it.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: aprscli:smoke-amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=aprscli-amd64
      - name: Build (arm64) for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: aprscli:smoke-arm64
          load: true
          provenance: false
          cache-from: type=gha,scope=aprscli-arm64
      - name: Smoke test both platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tests/container/smoke.sh aprscli:smoke-amd64 "$VERSION" linux/amd64
          tests/container/smoke.sh aprscli:smoke-arm64 "$VERSION" linux/arm64
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=aprscli-amd64
            type=gha,scope=aprscli-arm64
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        # Keyless: the certificate names this workflow and the release tag's run, and the signature is logged in Rekor.
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Add the digest to the job summary and the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Container image"
            echo
            echo "\`$IMAGE@$DIGEST\` (linux/amd64, linux/arm64), signed with cosign, with build provenance."
            echo
            echo "Tags:"
            for tag in $TAGS; do echo "- \`$tag\`"; done
          } > image.md
          cat image.md >> "$GITHUB_STEP_SUMMARY"
          # A re-run finds the digest already in the notes and leaves them alone.
          gh release view "$TAG" --json body --jq .body > notes.md
          if ! grep -q -F "$DIGEST" notes.md; then
            { echo; cat image.md; } >> notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi
