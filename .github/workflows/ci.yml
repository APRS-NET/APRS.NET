name: ci

# Always starts, so the ci-ok job below can be a required check, but the changes job skips the build, tests and
# format check for changes that cannot affect them: docs and Markdown (the corpus README stays in, since its table is
# tested) and repository settings files.
on:
  push:
    branches: [main]
  pull_request:
  # The deviceid workflow starts CI on its branch this way: a pull request it opens does not start workflows itself.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (a new branch, or history that was rewritten) everything runs.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2> /dev/null; then
            echo "No base to compare with: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$(git merge-base "$BASE" "$GITHUB_SHA")" "$GITHUB_SHA")"
          ignored='^(docs/|LICENSE$|\.release-please-manifest\.json$|\.github/dependabot\.yml$|\.github/workflows/(pr-title|symbols|packages|milestone|deviceid)\.yml$)|\.md$'
          code="$(printf '%s\n' "$changed" | grep -v -E "$ignored" | grep -v '^$' || true)"
          corpus="$(printf '%s\n' "$changed" | grep '^tests/corpus/' || true)"
          if [ -n "$code$corpus" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs or settings changed: skipping the build, tests and format check."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - name: Install Dire Wolf for the KISS audio test
        # KissAudioEndToEndTests turns packets into AFSK audio with gen_packets, plays it into Dire Wolf's standard
        # input (no sound card) and reads the decoded frames back over KISS TCP.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends direwolf
          echo "APRSNET_DIREWOLF_AUDIO=1" >> "$GITHUB_ENV"
      # Ubuntu's test run also collects coverage, so the coverage job needs no build of its own. A test that hangs
      # fails after 5 minutes with a dump, rather than holding all three runners until the 20-minute job limit.
      - run: >-
          dotnet test -c Release --no-build --logger GitHubActions --logger trx --results-directory test-results
          --blame-hang-timeout 5m --blame-hang-dump-type mini
          ${{ matrix.os == 'ubuntu-latest' && '--collect:"XPlat Code Coverage"' || '' }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/**/*.trx
            test-results/**/*.dmp
            test-results/**/Sequence_*.xml
          retention-days: 7
      - name: Pack (with package validation)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: test-results/**/coverage.cobertura.xml
          retention-days: 1

  coverage:
    # Coverage on one platform is enough. The gate uses the merged total of every test project.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only to push coverage badges to the badges branch on main
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - name: Coverage report
        run: |
          dotnet tool restore
          dotnet reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;JsonSummary;Badges" \
            -assemblyfilters:"+AprsNet.*;+aprscli;-*.Tests;-*.SpecTests;-*.CorpusTests"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage gate
        env:
          MIN_LINE: 90 # raise these when coverage improves; do not lower them to get a change through
          MIN_BRANCH: 85
        run: |
          jq -r '.summary | "line \(.linecoverage)%, branch \(.branchcoverage)%"' coverage/report/Summary.json
          jq -e ".summary.linecoverage >= $MIN_LINE" coverage/report/Summary.json > /dev/null \
            || { echo "::error::Line coverage is below $MIN_LINE%"; exit 1; }
          jq -e ".summary.branchcoverage >= $MIN_BRANCH" coverage/report/Summary.json > /dev/null \
            || { echo "::error::Branch coverage is below $MIN_BRANCH%"; exit 1; }
      - name: Publish coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          # Commit to the orphan badges branch only when a badge changed (the SVGs carry no timestamp).
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$url" badges > /dev/null; then
            git clone --quiet --depth 1 --branch badges "$url" "$dir"
          else
            git init --quiet "$dir"
            git -C "$dir" checkout --quiet --orphan badges
          fi
          cp coverage/report/badge_linecoverage.svg coverage/report/badge_branchcoverage.svg "$dir"/
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then
            echo "Coverage badges unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Update coverage badges for ${GITHUB_SHA::7}"
          git push --quiet "$url" HEAD:badges

  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .

  tools:
    # The tools under tools/ are file-based apps outside the solution, so the build above does not compile them; and
    # docs/spec/coverage and the device table are generated, so they are checked like the symbol pages in symbols.yml.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Compile every tool
        run: |
          for tool in tools/*/*.cs; do
            echo "::group::$tool"
            dotnet build "$tool"
            echo "::endgroup::"
          done
      - name: Check the device table is up to date
        run: |
          dotnet run tools/deviceid/Generate.cs
          if [ -n "$(git status --porcelain -- src/AprsNet.DeviceId/AprsDevices.Generated.cs)" ]; then
            echo "::error::AprsDevices.Generated.cs is out of date. Run 'dotnet run tools/deviceid/Generate.cs' and commit the result."
            exit 1
          fi
      - name: Check the corpus coverage pages are up to date
        run: |
          dotnet run tools/corpus/Coverage.cs
          if [ -n "$(git status --porcelain -- docs/spec/coverage)" ]; then
            git status --short -- docs/spec/coverage
            echo "::error::docs/spec/coverage is out of date. Run 'dotnet run tools/corpus/Coverage.cs' and commit the result."
            exit 1
          fi

  container:
    # Builds the aprscli image and checks it serves, offline: a gateway whose only TNC can't be reached still answers
    # APRS-IS clients with its banner, and /health with 503. See docs/guides/container.md.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t aprscli:ci .
      - name: Smoke test
        run: |
          docker run -d --name gateway -p 127.0.0.1:14580:14580 -p 127.0.0.1:14590:14590 aprscli:ci \
            serve --tnc 127.0.0.1:1 --listen 0.0.0.0:14580 --http 0.0.0.0:14590
          trap 'docker logs gateway; docker rm -f gateway > /dev/null' EXIT
          for _ in $(seq 30); do
            status="$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:14590/health || true)"
            [ "$status" != "000" ] && break
            sleep 1
          done
          cat health.json; echo
          [ "$status" = "503" ] || { echo "::error::/health answered $status, not 503"; exit 1; }
          jq -e '.status == "unhealthy" and .sources["127.0.0.1:1"].connected == false' health.json > /dev/null
          banner="$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/14580; head -n 1 <&3')"
          echo "$banner"
          case "$banner" in "# aprscli "*) ;; *) echo "::error::Unexpected banner"; exit 1 ;; esac
          docker exec gateway dotnet /app/aprscli.dll health || [ $? -eq 1 ]

  ci-ok:
    # The one check to require on main: it passes when every job above passed, or was skipped for a docs-only change.
    if: always()
    needs: [changes, build, coverage, format, tools, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::A CI job ended with '$result'."; exit 1 ;;
            esac
          done
