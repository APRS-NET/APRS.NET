name: milestone

# A pull request takes the milestone of the issue it works on, so each milestone page counts its open and merged pull
# requests as well as its issues. pull_request_target lets the token label pull requests from forks too: nothing from
# the pull request is checked out or run, and its description is only read as text.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  link:
    if: github.event.pull_request.milestone == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy the milestone from a linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          # Issues linked in the sidebar or by a closing keyword. GitHub only resolves these for pull requests into the
          # default branch, so the description is also searched: stacked pull requests target the branch below.
          linked=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F pr="$PR" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { closingIssuesReferences(first: 10) { nodes { number } } }
              }
            }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')
          named=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|part of|refs?:?) #[0-9]+' \
            | grep -oE '[0-9]+$' || true)
          for issue in $linked $named; do
            milestone=$(gh api "repos/$GH_REPO/issues/$issue" --jq '.milestone.number // empty' || true)
            if [ -n "$milestone" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/$PR" -F milestone="$milestone" --jq '"Milestone \(.milestone.title), from #'"$issue"'."'
              exit 0
            fi
          done
          echo "No linked issue has a milestone."
