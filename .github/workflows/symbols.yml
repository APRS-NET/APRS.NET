name: symbols

# Keeps docs/symbols (the conventional and modern symbol pages and their SVGs) in step with what AprsNet.Symbols draws.
# A pull request fails when the pages are out of date, so a reviewer sees the image changes and the regenerated pages
# arrive in the same pull request. Nothing is pushed to main, which required checks would block.
on:
  pull_request:
    paths:
      - src/AprsNet.Symbols/**
      - src/AprsNet.Packets/AprsSymbol.cs
      - tools/symbols/**
      - docs/symbols/**
      - .github/workflows/symbols.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet run tools/symbols/Generate.cs
      - name: Check the symbol pages are up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/symbols)" ]; then
            git status --short -- docs/symbols
            echo "::error::docs/symbols is out of date. Run 'dotnet run tools/symbols/Generate.cs' and commit the result."
            exit 1
          fi

